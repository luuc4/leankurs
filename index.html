{q:"Wie geht man bei der 5W-Methode vor?",a:["Problem beschreiben/Ursache analysieren/Abstellma\u00dfnahmen/Wirksamkeit \u00fcberpr\u00fcfen","Ursache analysieren/Problem beschreiben/Abstellma\u00dfnahmen/Wirksamkeit \u00fcberpr\u00fcfen","Ursache analysieren/Abstellma\u00dfnahmen/Problem beschreiben/Wirksamkeit \u00fcberpr\u00fcfen","Ursache analysieren/Problem beschreiben/Wirksamkeit \u00fcberpr\u00fcfen Abstellma\u00dfnahmen"],c:[0]},

{q:"Wie geht man bei der Ursachenanalyse bei der 5W-Methode vor?",a:["Es wird so lange warum gefragt bis die Ursache des Problems gefunden wird.","Wenn auf die Warum-Frage eine Antwort erfolgt, wird diese mit einer erneuten Warum-Formulierung hinterfragt.","Man darf auf keinen Fall \u00f6fter als 5 Warum-Fragen stellen, da man sonst zu tief in das Problem gelangt.","Die Ursachenanalyse muss schnell gehen."],c:[0,1]},
{q:"Was ist bei den Abstellma\u00dfnahmen zu beachten?",a:["Hat man die Ursache gefunden, gen\u00fcgt es geeignete Abstellma\u00dfnahmen zu diskutieren.","Der Ma\u00dfnahmenplan mit Verantwortlichen und Zeitvorgaben unterst\u00fctzt die Umsetzung.","Die getroffenen Ma\u00dfnahmen m\u00fcssen sich nicht auf das Problem beziehen.","Es ist egal wann die Ma\u00dfnahmen umgesetzt werden."],c:[1]},
{q:"Was ist bei der \u00dcberpr\u00fcfung der Wirksamkeit zu beachten?",a:["Direkt nach dem Umsetzen sollte das Ergebnis der Ma\u00dfnahmen nicht kontrolliert werden.","Sind die Ma\u00dfnahmen wirksam oder existiert das Problem noch immer.","Wenn es sich um eine wiederkehrende Ma\u00dfnahme handelt, ist eine regelm\u00e4\u00dfige wiederholende Kontrolle nicht sinnvoll.","Die Wirksamkeit ergibt sich aus der Ma\u00dfnahme. Sie ist daher nicht eigens zu \u00fcberpr\u00fcfen"],c:[1]},
{q:"Welche Regeln sind beim Durchf\u00fchren der 5W-Methode zu beachten?",a:["Immer direkt bei den Prozessbeteiligten die Fakten erfragen.","Nie vor Ort das Problem zeigen lassen, da man so unn\u00f6tige Diskussionen vermeiden kann.","Solange \u201eWarum?\u201c fragen, bis die tats\u00e4chliche Ursache gefunden ist.","Ob man die tats\u00e4chliche Ursache gefunden hat, erkennt man mit einer \u201eWenn-dann-Feststellung\u201c."],c:[0,2,3]},
{q:"Welche Nachteile hat die 5W-Methode?",a:["Oft gibt es nicht nur eine Ursache, sondern mehrere. Man muss sich entscheiden, welchen Pfad man verfolgt.","Es gibt immer nur eine Ursache f\u00fcr ein Problem, darum ist die 5W-Methode daf\u00fcr nicht geeignet.","Die Ergebnisse stehen in keinem Verh\u00e4ltnis zu dem Aufwand der 5W-Methode","Die 5W-Methode ist in unserem Kulturkreis nicht anwendbar."],c:[0]},
{q:"Die 5S-Methode \u2026 (Teil 1)",a:["\u2026 ist ein fundamentaler Baustein des Lean Management.","\u2026 eliminiert Verschwendungen am einzelnen Arbeitsplatz durch das Standardisieren der Arbeitsabl\u00e4ufe.","\u2026 hat ausschlie\u00dflich mit Sauberkeit am Arbeitsplatz zu tun.","\u2026 ist eine unn\u00f6tige Mehrbelastung der Mitarbeitenden"],c:[0,1]},
{q:"Die 5S-Methode \u2026 (Teil 2)",a:["\u2026 setzt nur bei den Arbeitspl\u00e4tzen der Mitarbeitenden an.","\u2026 setzt nur bei den Prozessen der Mitarbeiter an.","\u2026 setzt bei den Arbeitspl\u00e4tzen und Prozessen der Mitarbeitenden an."],c:[2]},
{q:"Die Hauptziele der 5S-Methode sind \u2026 (Teil 1)",a:["\u2026 Ordnung und Sauberkeit","\u2026 Qualit\u00e4t","\u2026 Ergonomie am Arbeitsplatz, Verbesserung der Arbeitssicherheit","\u2026 Wiedereingliederung in den Arbeitsprozess nach langer Krankheit"],c:[0,1,2]},

{q:"In welchen Schritten wird die 5S Methode durchgef\u00fchrt?",a:["Selbstdisziplin, Sortieren, Standards setzen, Sauberkeit schaffen, Systematisch anordnen","Sortieren, Systematisch anordnen, Sauberkeit schaffen, Standards setzen, Selbstdisziplin","Sauberkeit schaffen, Sortieren, Standards setzen, Selbstdisziplin, Systematisch anordnen","Selbstdisziplin, Sauberkeit schaffen, Sortieren, Standards setzen, Systematisch anordnen"],c:[1]},
{q:"Was muss bei Sortieren (5S) gemacht werden?",a:["Nicht ben\u00f6tigte Teile, Komponenten und Werkzeuge entfernen.","Selten ben\u00f6tigte Teile am Arbeitsplatz lassen.","St\u00e4ndig ben\u00f6tigte Teile vom Arbeitsplatz entfernen.","Alles so belassen wie es am Arbeitsplatz vorgefunden wird."],c:[0]},

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const BUCKET_COUNT = 4;
const ROUND_SIZE = 10;
const STORAGE_KEY = 'lean_quiz_state';

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && s.buckets && s.buckets.length === questions.length) return s;
  } catch(e) {}
  return { buckets: new Array(questions.length).fill(0) };
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
let currentRound = [];
let currentIndex = 0;
let roundCorrect = 0;
let roundWrong = 0;
let answered = false;

const app = document.getElementById('app');

function getBucketCounts() {
  const counts = [0,0,0,0];
  state.buckets.forEach(b => counts[b]++);
  return counts;
}

function renderBuckets() {
  const counts = getBucketCounts();
  const labels = ['Neu','Eimer 1','Eimer 2','Gelernt'];
  return `<div class="buckets">${counts.map((c,i) =>
    `<div class="bucket b${i}">${labels[i]}: ${c}</div>`
  ).join('')}</div>`;
}

function pickRound() {
  // Priority: bucket 0 first, then 1, then 2. Bucket 3 = done.
  let pool = [];
  for (let b = 0; b < 3; b++) {
    const indices = [];
    state.buckets.forEach((bk, i) => { if (bk === b) indices.push(i); });
    if (indices.length > 0) pool.push(...indices);
    if (pool.length >= ROUND_SIZE) break;
  }
  shuffle(pool);
  return pool.slice(0, ROUND_SIZE);
}

function allDone() {
  return state.buckets.every(b => b >= 3);
}

function showStart() {
  const counts = getBucketCounts();
  const total = questions.length;
  const done = counts[3];
  const pct = Math.round((done / total) * 100);

  if (allDone()) {
    app.innerHTML = `
      <h1>Lean Quiz</h1>
      ${renderBuckets()}
      <div class="done-msg">
        <h2>Geschafft!</h2>
        <p>Alle ${total} Fragen sind im Eimer "Gelernt".</p>
        <button class="reset-btn" onclick="resetAll()">Neustart</button>
      </div>`;
    return;
  }

  app.innerHTML = `
    <h1>Lean Quiz</h1>
    ${renderBuckets()}
    <div class="progress-bar-bg"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="card" style="text-align:center">
      <p style="margin-bottom:12px">${total - done} Fragen noch offen</p>
      <button class="start-btn" onclick="startRound()">Runde starten (${Math.min(ROUND_SIZE, total - done)} Fragen)</button>
    </div>
    <div style="text-align:center;margin-top:16px">
      <button class="reset-btn" onclick="resetAll()">Fortschritt zur\u00fccksetzen</button>
    </div>`;
}

function startRound() {
  currentRound = pickRound();
  currentIndex = 0;
  roundCorrect = 0;
  roundWrong = 0;
  showQuestion();
}

function showQuestion() {
  if (currentIndex >= currentRound.length) {
    showRoundSummary();
    return;
  }
  answered = false;
  const qi = currentRound[currentIndex];
  const q = questions[qi];
  const bucket = state.buckets[qi];

  // Create shuffled answer indices
  const answerOrder = shuffle([...Array(q.a.length).keys()]);
  const isMulti = q.c.length !== 1;
  const isNone = q.c.length === 0;

  window._qi = qi;
  window._answerOrder = answerOrder;
  window._selected = new Set();

  app.innerHTML = `
    <h1>Lean Quiz</h1>
    ${renderBuckets()}
    <div class="round-progress">Frage ${currentIndex + 1} / ${currentRound.length} | Eimer: ${bucket}</div>
    <div class="card">
      <div class="question-text">${q.q}</div>
      <div class="hint">${isNone ? 'Hinweis: Es kann sein, dass keine Antwort richtig ist.' : isMulti ? 'Mehrere Antworten m\u00f6glich.' : 'Eine Antwort ist richtig.'}</div>
      <div class="answers" id="answers">
        ${answerOrder.map((ai, idx) =>
          `<button class="answer-btn" id="ans_${idx}" onclick="toggleAnswer(${idx})">${q.a[ai]}</button>`
        ).join('')}
      </div>
      ${isNone ? '<div class="none-correct-note">Wenn keine richtig ist, einfach ohne Auswahl pr\u00fcfen.</div>' : ''}
      <button class="check-btn" id="checkBtn" onclick="checkAnswer()">Pr\u00fcfen</button>
    </div>`;
}

function toggleAnswer(idx) {
  if (answered) return;
  const sel = window._selected;
  if (sel.has(idx)) sel.delete(idx); else sel.add(idx);
  document.querySelectorAll('.answer-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', sel.has(i));
  });
}

function checkAnswer() {
  if (answered) return;
  answered = true;
  const qi = window._qi;
  const q = questions[qi];
  const order = window._answerOrder;
  const selected = window._selected;

  // Map selected button indices back to original answer indices
  const selectedOriginal = new Set();
  selected.forEach(idx => selectedOriginal.add(order[idx]));

  const correctSet = new Set(q.c);
  const isCorrect = correctSet.size === selectedOriginal.size &&
    [...correctSet].every(c => selectedOriginal.has(c));

  // Color the buttons
  order.forEach((ai, idx) => {
    const btn = document.getElementById('ans_' + idx);
    btn.disabled = true;
    if (correctSet.has(ai) && selectedOriginal.has(ai)) {
      btn.classList.add('correct');
    } else if (selectedOriginal.has(ai) && !correctSet.has(ai)) {
      btn.classList.add('wrong');
    } else if (correctSet.has(ai)) {
      btn.classList.add('missed');
    }
  });

  // Update bucket
  if (isCorrect) {
    roundCorrect++;
    state.buckets[qi] = Math.min(3, state.buckets[qi] + 1);
  } else {
    roundWrong++;
    if (state.buckets[qi] >= 2) {
      state.buckets[qi] = 0; // back to 0 if in bucket 2 or 3
    } else if (state.buckets[qi] === 1) {
      state.buckets[qi] = 0;
    }
    // bucket 0 stays at 0
  }
  saveState(state);

  const resultDiv = document.createElement('div');
  resultDiv.className = 'result ' + (isCorrect ? 'correct' : 'wrong');
  if (isCorrect) {
    resultDiv.textContent = 'Richtig!';
  } else if (q.c.length === 0) {
    resultDiv.textContent = 'Falsch \u2013 Keine Antwort war richtig.';
  } else {
    resultDiv.textContent = 'Falsch \u2013 Die richtige(n) Antwort(en) sind markiert.';
  }

  const card = document.querySelector('.card');
  const checkBtn = document.getElementById('checkBtn');
  checkBtn.style.display = 'none';
  card.appendChild(resultDiv);

  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.textContent = currentIndex + 1 >= currentRound.length ? 'Ergebnis anzeigen' : 'N\u00e4chste Frage';
  nextBtn.onclick = () => { currentIndex++; showQuestion(); };
  card.appendChild(nextBtn);
}

function showRoundSummary() {
  const counts = getBucketCounts();
  const total = questions.length;
  const done = counts[3];
  const pct = Math.round((done / total) * 100);
  const remaining = total - done;

  app.innerHTML = `
    <h1>Lean Quiz</h1>
    ${renderBuckets()}
    <div class="progress-bar-bg"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="summary">
      <h2>Runde beendet</h2>
      <div class="summary-stats">
        <div class="summary-stat"><span>Richtig</span><span style="color:#27ae60;font-weight:700">${roundCorrect}</span></div>
        <div class="summary-stat"><span>Falsch</span><span style="color:#e74c3c;font-weight:700">${roundWrong}</span></div>
        <div class="summary-stat"><span>Gesamt gelernt</span><span>${done} / ${total}</span></div>
      </div>
      ${remaining > 0 ?
        `<button class="continue-btn" onclick="startRound()">Weiter lernen (${Math.min(ROUND_SIZE, remaining)} Fragen)</button>
         <button class="reset-btn" style="width:100%;margin-top:8px" onclick="showStart()">Pause</button>` :
        `<div class="done-msg"><h2>Geschafft!</h2><p>Alle Fragen gelernt!</p></div>
         <button class="reset-btn" style="width:100%" onclick="resetAll()">Neustart</button>`
      }
    </div>`;
}

function resetAll() {
  if (!confirm('Fortschritt wirklich zur\u00fccksetzen?')) return;
  state = { buckets: new Array(questions.length).fill(0) };
  saveState(state);
  showStart();
}

// Make functions global
window.startRound = startRound;
window.toggleAnswer = toggleAnswer;
window.checkAnswer = checkAnswer;
window.showStart = showStart;
window.resetAll = resetAll;

showStart();
</script>
